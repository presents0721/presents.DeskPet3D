<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 桌宠</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- ★ 三方库全部随插件分发（vendor/），不走 CDN：
       ① 没网 / 国内访问 jsdelivr 不通时，桌宠不会白屏；
       ② 版本固定，不受 CDN 上版本漂移影响。改库版本时同步改这里与 vendor/。 -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/",
      "three-vrm": "./vendor/three-vrm.module.js",
      "three-vrm-animation": "./vendor/three-vrm-animation.module.js"
    }
  }
  </script>
  <!-- ★ MMD 物理（ammo.js）同样本地化：先取到工厂函数，pet.js 在真正用到物理时再实例化
       （实例化要读 .wasm，file:// 下会被挡 ⇒ 由 pet.js 用 locateFile 指到 vendor/ammo/）。 -->
  <script src="vendor/ammo/ammo.wasm.js"></script>
  <script>
    (function () {
      try { window.__AmmoFactory = (typeof Ammo === 'function') ? Ammo : null; } catch (e) { window.__AmmoFactory = null; }
      try { if (typeof Ammo === 'function') { window.Ammo = undefined; } } catch (e) { }
    })();
  </script>
</head>
<body>
  <canvas id="canvas" data-drag></canvas>
  <div id="subtitle" class="subtitle hidden"></div>
  <div id="busy" class="busy hidden">思考中…</div>
  <div id="now-playing" class="now-playing hidden"></div>
  <div id="ground-line-l" class="ground-line hidden"></div>
  <div id="ground-line-r" class="ground-line hidden"></div>
  <div id="pet-menu" class="pet-menu hidden"></div>
  <div id="settings-panel" class="settings-panel hidden"></div>




 
<!-- ★★ 2026-10-16 根治"改了代码不生效"：静态 <script src="xxx.js"> 会被 WebView2 缓存住 ⇒ 改完重启也不加载新文件。
     现在带"加载时刻"查询串 + 串行加载（onload 链），保证 pet.js（依赖前 5 个全局对象）最后执行。 -->
<script>
 (function () {
  var t = '?t=' + Date.now();
  var list = ['motion/pose.js', 'motion/state.js', 'motion/runtime.js', 'embodied-compose.js', 'embodied-validate.js', 'ardy-retarget.js', 'ardy-web/ardy-client.js', 'embodied-expression.js', 'face-engine.js'];
  var i = 0;
  function next() {
   if (i >= list.length) {
    var m = document.createElement('script'); m.type = 'module'; m.src = 'pet.js' + t; document.body.appendChild(m); return;
   }
   var s = document.createElement('script'); s.src = list[i++] + t; s.onload = next; s.onerror = next; document.body.appendChild(s);
  }
  next();
 })();
</script>
</body>
</html>
